[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repath-web-ui-locator-healing"
version = "0.5.0"
description = "Evaluation and reproducibility package for REPATH self-healing Web UI test locators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "opencv-python-headless>=4.8,<5",
  "lightgbm>=4.3,<5",
  "sentence-transformers>=3.0,<6",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=10,<13",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
notebooks = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "optuna>=4,<5",
  "tqdm>=4.66,<5",
]

[project.scripts]
repath-eval = "repath_evaluation.cli:main"
repath-benchmark = "repath_evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
